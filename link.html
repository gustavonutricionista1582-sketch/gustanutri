  <style>
    :root {
      --font-sans: 'Poppins', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --primary: #E30613;
      --primary-glow: #FF2E3B;
      --primary-hover: #C50510;
      --whatsapp: #25D366;
      --whatsapp-glow: rgba(37, 211, 102, 0.4);
      --bg-dark: #0A0A0C;
      --bg-card: rgba(26, 26, 30, 0.85);
      --bg-card-hover: rgba(36, 36, 42, 0.95);
      --border-card: rgba(255, 255, 255, 0.08);
      --border-card-hover: rgba(227, 6, 19, 0.5);
      --text-white: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.65);
      --text-dim: rgba(255, 255, 255, 0.45);
      --radius-btn: 1.25rem;
      --radius-round: 9999px;
      --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: radial-gradient(circle at 50% 10%, rgba(227, 6, 19, 0.12) 0%, rgba(10, 10, 12, 1) 60%);
      padding: 0 1rem 2.5rem;
    }

    .biolink-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Ambient decorative lighting */
    .ambient-glow {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(227, 6, 19, 0.25) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    /* Hero Header */
    .hero-header {
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
      z-index: 1;
    }

    .photo-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 1.25rem;
    }

    .photo-glow {
      position: absolute;
      inset: -4px;
      border-radius: var(--radius-round);
      background: linear-gradient(135deg, var(--primary), rgba(255, 255, 255, 0.2), var(--primary-glow));
      animation: rotateGlow 8s linear infinite;
      opacity: 0.8;
      filter: blur(2px);
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .photo-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: var(--radius-round);
      overflow: hidden;
      border: 3px solid rgba(10, 10, 12, 0.95);
      background: #151518;
      box-shadow: var(--shadow-card);
    }

    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .brand-logo {
      height: 2.25rem;
      width: auto;
      object-fit: contain;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-white);
      text-align: center;
    }

    .profile-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
      text-align: center;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.5rem;
      padding: 0.3rem 0.85rem;
      border-radius: var(--radius-round);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: var(--text-muted);
      backdrop-filter: blur(10px);
    }

    .profile-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
    }

    /* Quick Social Icons Row */
    .quick-socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.875rem;
      margin-top: 1.5rem;
      margin-bottom: 1.75rem;
      z-index: 1;
    }

    .social-circle-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-round);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
      text-decoration: none;
      transition: var(--transition);
      backdrop-filter: blur(8px);
    }

    .social-circle-btn:hover {
      background: var(--primary);
      border-color: var(--primary-glow);
      color: #FFFFFF;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px -4px rgba(227, 6, 19, 0.5);
    }

    .social-circle-btn.whatsapp:hover {
      background: var(--whatsapp);
      border-color: #25D366;
      box-shadow: 0 8px 20px -4px var(--whatsapp-glow);
    }

    .social-circle-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    /* Links Section */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 1;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-btn);
      text-decoration: none;
      color: var(--text-white);
      transition: var(--transition);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transition: left 0.6s ease;
    }

    .link-card:hover::before {
      left: 100%;
    }

    .link-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-card-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -5px rgba(227, 6, 19, 0.25);
    }

    .link-card.featured {
      background: linear-gradient(135deg, rgba(37, 211, 102, 0.12) 0%, rgba(26, 26, 30, 0.95) 100%);
      border-color: rgba(37, 211, 102, 0.3);
    }

    .link-card.featured:hover {
      border-color: var(--whatsapp);
      box-shadow: 0 12px 30px -5px var(--whatsapp-glow);
    }

    .link-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--primary);
      transition: var(--transition);
    }

    .link-card.featured .link-icon-box {
      background: rgba(37, 211, 102, 0.15);
      border-color: rgba(37, 211, 102, 0.3);
      color: var(--whatsapp);
    }

    .link-card:hover .link-icon-box {
      transform: scale(1.08);
      background: var(--primary);
      color: #FFFFFF;
    }

    .link-card.featured:hover .link-icon-box {
      background: var(--whatsapp);
      color: #FFFFFF;
    }

    .link-icon-box svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    .link-content {
      flex: 1;
      min-width: 0;
    }

    .link-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-white);
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .link-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-round);
      background: rgba(37, 211, 102, 0.2);
      color: var(--whatsapp);
      border: 1px solid rgba(37, 211, 102, 0.4);
    }

    .link-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: var(--transition);
    }

    .link-card:hover .link-arrow {
      background: var(--primary);
      color: #FFFFFF;
      transform: translateX(3px);
    }

    .link-card.featured:hover .link-arrow {
      background: var(--whatsapp);
      color: #FFFFFF;
    }

    .link-arrow svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5;
    }

    /* Footer Section */
    .biolink-footer {
      margin-top: 2.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 1;
    }

    .footer-connect {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .footer-connect::before,
    .footer-connect::after {
      content: '';
      width: 24px;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .footer-copy strong {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Small Mobile adjustments */
    @media (max-width: 380px) {
      body {
        padding: 0 0.75rem 2rem;
      }
      .link-card {
        padding: 0.95rem 1rem;
        gap: 0.75rem;
      }
      .link-icon-box {
        width: 42px;
        height: 42px;
      }
      .link-title {
        font-size: 0.95rem;
      }
      .link-subtitle {
        font-size: 0.74rem;
      }
    }
  </style>
</head>
